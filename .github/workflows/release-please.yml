name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write      # to push the version bump commit and create the GitHub Release
  pull-requests: write # to open and update the Release PR

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          release-type: node
