name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write  # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          node-version: '24'  # Node 24 ships with npm 11+, required for OIDC trusted publishing
          registry-url: https://registry.npmjs.org
      - run: pnpm run build
      - name: Publish to npm
        run: npm publish  # provenance is automatic via trusted publishing OIDC
