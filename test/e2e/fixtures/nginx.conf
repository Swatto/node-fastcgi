worker_processes 1;

events {}

http {
    server {
        listen 80;
        listen [::]:80;

        location / {
            # Standard CGI variables (REQUEST_METHOD, QUERY_STRING, SERVER_NAME, …)
            include fastcgi_params;

            # Explicit HTTP_HOST so the library can build the full URL correctly
            fastcgi_param HTTP_HOST $http_host;

            fastcgi_pass app:9000;
        }
    }
}
